<text class="tick" x="82.0" y="399.5" text-anchor="end">0.62</text>
<line class="grid" x1="88.0" x2="756.0" y1="328.0" y2="328.0"/>
<text class="tick" x="82.0" y="331.5" text-anchor="end">0.64</text>
<line class="grid" x1="88.0" x2="756.0" y1="260.0" y2="260.0"/>
<text class="tick" x="82.0" y="263.5" text-anchor="end">0.66</text>
<line class="grid" x1="88.0" x2="756.0" y1="192.0" y2="192.0"/>
<text class="tick" x="82.0" y="195.5" text-anchor="end">0.68</text>
<line class="grid" x1="88.0" x2="756.0" y1="124.0" y2="124.0"/>
<text class="tick" x="82.0" y="127.5" text-anchor="end">0.70</text>
<line class="grid" x1="88.0" x2="88.0" y1="124" y2="464"/>
<text class="tick" x="88.0" y="480" text-anchor="middle">0.84</text>
<line class="grid" x1="310.7" x2="310.7" y1="124" y2="464"/>
<text class="tick" x="310.7" y="480" text-anchor="middle">0.86</text>
<line class="grid" x1="533.3" x2="533.3" y1="124" y2="464"/>
<text class="tick" x="533.3" y="480" text-anchor="middle">0.88</text>
<line class="grid" x1="756.0" x2="756.0" y1="124" y2="464"/>
<text class="tick" x="756.0" y="480" text-anchor="middle">0.90</text>
<line class="axis" x1="88.0" x2="756.0" y1="464" y2="464"/>
<text class="panel" x="48.0" y="110">held-out accuracy (higher is better)</text>
<text class="muted" x="756.0" y="498" text-anchor="end">in-distribution accuracy &#8594;</text>
<text class="muted" x="752.0" y="138" text-anchor="end">better: right and up</text>
<line class="line1" x1="271.7" y1="294.7" x2="301.8" y2="396.0" marker-end="url(#arr)"/>
<line class="line1" x1="301.8" y1="396.0" x2="371.9" y2="282.8" marker-end="url(#arr)"/>
<line class="line1" x1="371.9" y1="282.8" x2="597.9" y2="307.6" marker-end="url(#arr)"/>
<line class="line1" x1="597.9" y1="307.6" x2="622.4" y2="338.2" marker-end="url(#arr)"/>
<g><title>Qwen3-1.7B, scaling test: in-distribution 0.848 (14 training tasks), held-out 0.620</title><circle class="hit" cx="180.4" cy="396.0" r="11"/><rect class="dot3" x="175.4" y="391.0" width="10" height="10" rx="2"/></g>
<text x="180.4" y="414.0" text-anchor="middle">Qwen3-1.7B, scaling test</text>
<g><title>Qwen3-4B, scaling test: in-distribution 0.851 (14 training tasks), held-out 0.681</title><circle class="hit" cx="212.7" cy="189.3" r="11"/><rect class="dot3" x="207.7" y="184.3" width="10" height="10" rx="2"/></g>
<text x="220.7" y="181.3" text-anchor="start">Qwen3-4B, scaling test</text>
<g><title>v4: in-distribution 0.857 (18 training tasks), held-out 0.650</title><circle class="hit" cx="271.7" cy="294.7" r="11"/><circle class="dot1" cx="271.7" cy="294.7" r="5"/></g>
<text x="263.7" y="286.7" text-anchor="end">v4</text>
<g><title>v5: in-distribution 0.859 (21 training tasks), held-out 0.620</title><circle class="hit" cx="301.8" cy="396.0" r="11"/><circle class="dot1" cx="301.8" cy="396.0" r="5"/></g>
<text x="309.8" y="400.0" text-anchor="start">v5</text>
<g><title>v7: in-distribution 0.866 (21 training tasks), held-out 0.653</title><circle class="hit" cx="371.9" cy="282.8" r="11"/><circle class="dot1" cx="371.9" cy="282.8" r="5"/></g>
<text x="379.9" y="274.8" text-anchor="start">v7</text>
<g><title>v13: in-distribution 0.886 (21 training tasks), held-out 0.646</title><circle class="hit" cx="597.9" cy="307.6" r="11"/><circle class="dot1" cx="597.9" cy="307.6" r="5"/></g>
<text x="589.9" y="321.6" text-anchor="end">v13</text>
<g><title>v14: in-distribution 0.888 (21 training tasks), held-out 0.637</title><circle class="hit" cx="622.4" cy="338.2" r="11"/><circle class="dot1" cx="622.4" cy="338.2" r="5"/></g>
<text x="630.4" y="342.2" text-anchor="start">v14</text>
<text class="muted" x="24" y="542">Measured only for v4, v5, v7, v13, v14. Training-task sets differ: v4 18, v5 onwards 21, scaling runs 14. v5 held-out: its four common tasks, recombined.</text>
</svg>

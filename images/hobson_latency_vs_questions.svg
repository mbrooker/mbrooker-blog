<text x="687.8" y="392.8">shared prefix</text>
<text class="muted" x="24" y="476">Shared prefix: the state is encoded once and every question reads its cache. Batched: state and question encoded once per question.</text>
<text class="muted" x="24" y="494">Answers agree on both paths except one of 16 (bf16 rounding). Timings from bench_prefix.py output, 2026-09-26; not re-measured on v18.</text>
